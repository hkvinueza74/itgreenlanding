<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITGREEN SOLUTIONS | Liderando Soluciones Tecnológicas Sustentables</title>
  <!-- Iconos y Tipografía Corporativa -->
  <link rel="stylesheet" href="https://cloudflare.com">
  <link href="https://googleapis.com" rel="stylesheet">
  
  <style>
    /* --- PALETA DE COLORES OFICIAL ITGREEN --- */
    :root {
      --azul-logo: #0B5294;
      --verde-logo: #2EAF4A;
      --oscuro: #0F172A;
      --gris-texto: #475569;
      --fondo-claro: #F8FAFC;
      --blanco: #FFFFFF;
    }

    /* --- RESETEO GENERAL --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Poppins', sans-serif;
      color: var(--oscuro);
      background-color: var(--fondo-claro);
      line-height: 1.6;
      scroll-behavior: smooth;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }
    section {
      padding: 100px 0;
    }

    /* --- COMPONENTES COMPARTIDOS --- */
    .section-title {
      text-align: center;
      font-size: 2.6rem;
      color: var(--azul-logo);
      margin-bottom: 20px;
      font-weight: 700;
    }
    .section-subtitle {
      text-align: center;
      color: var(--gris-texto);
      max-width: 700px;
      margin: 0 auto 60px;
      font-size: 1.1rem;
    }
    .section-title span {
      color: var(--verde-logo);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background-color: var(--verde-logo);
      color: var(--blanco);
      padding: 16px 36px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(46, 175, 74, 0.25);
    }
    .btn:hover {
      background-color: var(--azul-logo);
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(11, 82, 148, 0.3);
    }

    /* --- HEADER & NAVBAR --- */
    header {
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 15px 0;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo-box {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .logo-img-sim {
      position: relative;
      width: 45px;
      height: 45px;
      border: 3.5px solid var(--azul-logo);
      border-radius: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-img-sim i {
      font-size: 1.4rem;
      color: var(--verde-logo);
    }
    .logo-img-sim::after {
      content: '\f1e6';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      left: -8px;
      bottom: 8px;
      font-size: 0.8rem;
      color: var(--azul-logo);
      background: white;
      padding: 2px;
    }
    .logo-brand {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--azul-logo);
      line-height: 1;
    }
    .logo-brand span {
      color: var(--verde-logo);
      display: block;
      font-size: 1.1rem;
      font-weight: 500;
      margin-top: 2px;
    }
    .nav-menu {
      display: flex;
      list-style: none;
      gap: 30px;
    }
    .nav-menu a {
      text-decoration: none;
      color: var(--oscuro);
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.3s;
    }
    .nav-menu a:hover {
      color: var(--verde-logo);
    }

    /* --- HERO SECTOR --- */
    .hero {
      background: radial-gradient(circle at top right, rgba(46, 175, 74, 0.05), transparent), var(--blanco);
      padding: 100px 0 120px;
    }
    .hero-wrapper {
      display: flex;
      align-items: center;
      gap: 60px;
    }
    .hero-content {
      flex: 1.2;
    }
    .slogan-tag {
      display: inline-block;
      background-color: rgba(46, 175, 74, 0.1);
      color: var(--verde-logo);
      padding: 6px 16px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .hero-content h1 {
      font-size: 3.4rem;
      color: var(--azul-logo);
      line-height: 1.15;
      margin-bottom: 25px;
      font-weight: 700;
    }
    .hero-content p {
      font-size: 1.1rem;
      color: var(--gris-texto);
      margin-bottom: 35px;
    }
    .hero-graphic {
      flex: 0.8;
      display: flex;
      justify-content: center;
    }
    .infographic-container {
      position: relative;
      width: 380px;
      height: 380px;
      background: var(--blanco);
      border-radius: 50%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .center-core {
      width: 140px;
      height: 140px;
      background: linear-gradient(135deg, var(--azul-principal), var(--azul-logo));
      background-color: var(--azul-logo);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      z-index: 2;
      box-shadow: 0 10px 25px rgba(11, 82, 148, 0.3);
    }
    .center-core i { font-size: 2.2rem; margin-bottom: 4px; }
    .center-core span { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
    .orbit {
      position: absolute;
      border: 2px dashed #E2E8F0;
      border-radius: 50%;
      animation: spin 25s linear infinite;
    }
    .orbit-1 { width: 260px; height: 260px; }
    .orbit-2 { width: 350px; height: 350px; animation-duration: 40s; animation-direction: reverse; }
    .node {
      position: absolute;
      width: 50px;
      height: 50px;
      background: var(--blanco);
      border: 3px solid var(--azul-logo);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--azul-logo);
      font-size: 1.1rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .node.green-tech {
      border-color: var(--verde-logo);
      color: var(--verde-logo);
    }
    /* Posiciones en órbita */
    .n1 { top: -25px; left: 105px; }
    .n2 { bottom: -25px; right: 105px; }
    .n3 { top: 105px; left: -25px; }
    .n4 { top: 105px; right: -25px; }
    
    @keyframes spin { 100% { transform: rotate(30deg); } }

    /* --- QUIENES SOMOS --- */
    .about {
      background-color: var(--blanco);
    }
    .about-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }
    .about-text h3 {
      font-size: 1.8rem;
      color: var(--azul-logo);
      margin-bottom: 20px;
    }
    .about-text p {
      color: var(--gris-texto);
      margin-bottom: 20px;
      font-size: 1rem;
    }
    .about-features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .about-box {
      background-color: var(--fondo-claro);
      padding: 25px;
      border-radius: 16px;
      border-left: 4px solid var(--verde-logo);
    }
    .about-box h4 {
      color: var(--azul-logo);
      margin-bottom: 8px;
      font-size: 1.1rem;
    }
    .about-box p {
      font-size: 0.85rem;
      color: var(--gris-texto);
    }

    /* --- DOLOR Y SOLUCIÓN --- */
    .problem-solution {
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      color: var(--blanco);
    }
    .split-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: stretch;
    }
    .pane {
      padding: 45px;
      border-radius: 20px;
    }
    .problem-pane {
      background: rgba(239, 68, 68, 0.05);
      border: 1px solid rgba(239, 68, 68, 0.15);
    }
    .problem-pane h3 {
      color: #EF4444;
      font-size: 1.8rem;
      margin-bottom: 20px;
    }
    .solution-pane {
      background: rgba(46, 175, 74, 0.05);
      border: 1px solid rgba(46, 175, 74, 0.2);
    }
    .solution-pane h3 {
      color: var(--verde-logo);
      font-size: 1.8rem;
      margin-bottom: 20px;
    }

    /* --- PORTAFOLIO DE PRODUCTOS --- */
    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 30px;
    }
    .portfolio-card {
      background: var(--blanco);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.02);
      border: 1px solid #E2E8F0;
      transition: all 0.3s ease;
    }
    .portfolio-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.06);
    }
    .card-img {
      height: 220px;
      background-size: cover;
      background-position: center;
      position: relative;
    }
    .card-body {
      padding: 30px;
    }
    .card-body h3 {
      font-size: 1.35rem;
      color: var(--azul-logo);
      margin-bottom: 12px;
    }
    .card-body p {
      color: var(--gris-texto);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    .tech-details {
      background: var(--fondo-claro);
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
    }
    .tech-details h5 {
      font-size: 0.85rem;
      color: var(--azul-logo);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .tech-details ul {
      list-style: none;
      font-size: 0.8rem;
      color: var(--gris-texto);
    }
    .tech-details ul li {
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tech-details ul li i { color: var(--verde-logo); }
